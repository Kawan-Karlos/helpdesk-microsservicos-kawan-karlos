version: 2
updates:
  # Cada serviço tem as próprias dependências
  - package-ecosystem: pip
    directories: [/servicos/usuarios, /servicos/inventario, /servicos/chamados, /servicos/notificacoes, /gateway]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/servicos/usuarios, /servicos/inventario, /servicos/chamados, /servicos/notificacoes, /gateway]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
